server:
  port: 8080
  tomcat:
    # 上传超限时 Tomcat 默认只肯把 2MB 请求体读完就断连接，浏览器会看到"连接被重置"而不是我们的提示页。
    # 设成 -1 = 不限制，让请求完整读完，用户才能看到"图片太大了"的友好提示。
    max-swallow-size: -1

spring:
  application:
    name: my-blog

  # ===== 数据源：MySQL 8（库名 blog）=====
  # 想换回 H2（没装 MySQL 时）就加启动参数 --spring.profiles.active=h2
  datasource:
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "123456"

  jpa:
    hibernate:
      ddl-auto: update
    # 故意不写 database-platform：让 Hibernate 按实际连接自动选方言。
    # 写死 MySQLDialect 会让 @DataJpaTest 用内嵌 H2 时也生成 MySQL 的 DDL（engine=InnoDB）而报错。
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: false

  # 上传壁纸的大小限制（单个文件 40MB，单次请求也放到 40MB 以上才够用）
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 45MB

blog:
  title: Stellara的个人博客
  subtitle: 记录学习与生活的角落
  author: suixingchen
  # 前台与后台列表每页条数
  page-size: 5
  # 壁纸文件存放目录（相对项目根目录）
  upload-dir: ./uploads

logging:
  level:
    com.example.blog: info
