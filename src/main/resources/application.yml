server:
  port: 8080

spring:
  application:
    name: my-blog

  # 默认使用 H2 文件数据库，开箱即用；数据文件落在项目根目录的 data/ 下
  datasource:
    url: jdbc:h2:file:./data/blogdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false

blog:
  title: 我的个人博客
  subtitle: 记录学习与生活的角落
  author: suixingchen
  # 前台与后台列表每页条数
  page-size: 5

logging:
  level:
    com.example.blog: info
