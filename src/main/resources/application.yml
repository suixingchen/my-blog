server:
  port: 8080

spring:
  application:
    name: my-blog

  # ===== 数据源：MySQL 8（库名 blog）=====
  # 想换回 H2（没装 MySQL 时）就加启动参数 --spring.profiles.active=h2
  datasource:
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "123456"

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: false

  # 上传壁纸的大小限制
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

blog:
  title: 我的个人博客
  subtitle: 记录学习与生活的角落
  author: suixingchen
  # 前台与后台列表每页条数
  page-size: 5
  # 壁纸文件存放目录（相对项目根目录）
  upload-dir: ./uploads

logging:
  level:
    com.example.blog: info
