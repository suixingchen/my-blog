# MySQL 环境配置：用 --spring.profiles.active=mysql 启用
# 使用前请先创建数据库：CREATE DATABASE myblog DEFAULT CHARACTER SET utf8mb4;
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  jpa:
    hibernate:
      # 首次启动自动建表；表结构稳定后可改为 none 并手工执行 db/schema-mysql.sql
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  h2:
    console:
      enabled: false

logging:
  level:
    com.example.blog: info
