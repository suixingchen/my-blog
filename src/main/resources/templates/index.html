<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('首页')}"></head>
<body th:classappend="${bgImage != null} ? 'has-wallpaper' : ''">
<header th:replace="~{fragments/layout :: header}"></header>

<!-- ===== 首屏：只显示壁纸 =====
     背景图是 /theme.css 给 body 设的，所以这一屏除了站名和一句下滑提示什么都不放，
     让壁纸完整露出来。"has-wallpaper"这个 class 只在设置了壁纸时才加，
     因为白字放在浅色默认背景上会看不见，那时改用深色文字。 -->
<section class="hero-full">
    <div class="hero-inner">
        <p class="hero-eyebrow">Welcome</p>
        <h1 th:text="${blogTitle}">我的个人博客</h1>
        <p th:text="${blogSubtitle}">记录学习与生活的角落</p>
        <a class="scroll-cue" href="#posts">
            <span>向下滑动 · 看文章</span>
            <span class="arrow" aria-hidden="true"></span>
        </a>
    </div>
</section>

<!-- ===== 第二屏起：文章列表 ===== -->
<main class="container layout" id="posts">
    <div class="main-col">
        <form class="search-bar reveal" th:action="@{/}" method="get">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="搜索标题或标签…">
            <input type="hidden" name="category" th:value="${currentCategory}" th:if="${currentCategory != null}">
            <button type="submit" class="btn btn-primary">搜索</button>
            <a class="btn" th:href="@{/}" th:if="${keyword != null and !keyword.isBlank()}">清空</a>
        </form>

        <p class="search-hint" th:if="${(keyword != null and !keyword.isBlank()) or currentCategory != null}">
            共找到
            <strong th:text="${articlePage.totalElements}">0</strong>
            篇文章
            <span th:if="${keyword != null and !keyword.isBlank()}">，关键字「<strong th:text="${keyword}"></strong>」</span>
            <span th:if="${currentCategory != null}">，分类「<strong th:text="${currentCategory}"></strong>」</span>
        </p>

        <section class="post-list reveal">
            <article class="post-card" th:each="post : ${posts}">
                <h2 class="post-title">
                    <a th:href="@{/article/{id}(id=${post.id})}" th:text="${post.title}">文章标题</a>
                </h2>

                <p class="meta">
                    <a class="badge" th:if="${post.category != null}"
                       th:href="@{/(category=${post.category})}" th:text="${post.category}">分类</a>
                    <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">2024-05-01</span>
                    <span>·</span>
                    <span th:text="${post.views} + ' 次阅读'">0 次阅读</span>
                </p>

                <p class="summary" th:text="${post.displaySummary}">摘要</p>

                <div class="tags" th:if="${post.tags != null and !post.tags.isBlank()}">
                    <span class="tag" th:each="tag : ${#strings.arraySplit(post.tags, ',')}"
                          th:text="${#strings.trim(tag)}">标签</span>
                </div>

                <a class="read-more" th:href="@{/article/{id}(id=${post.id})}">阅读全文 →</a>
            </article>
        </section>

        <nav class="pagination" th:if="${articlePage.totalPages > 1}">
            <a class="page-link" th:classappend="${articlePage.first} ? 'disabled'"
               th:href="@{/(page=${articlePage.number}, keyword=${keyword}, category=${currentCategory})}">上一页</a>
            <a class="page-link" th:each="i : ${#numbers.sequence(1, articlePage.totalPages)}"
               th:classappend="${i == articlePage.number + 1} ? 'active'"
               th:href="@{/(page=${i}, keyword=${keyword}, category=${currentCategory})}"
               th:text="${i}">1</a>
            <a class="page-link" th:classappend="${articlePage.last} ? 'disabled'"
               th:href="@{/(page=${articlePage.number + 2}, keyword=${keyword}, category=${currentCategory})}">下一页</a>
        </nav>

        <div class="card empty" th:if="${#lists.isEmpty(posts)}">
            <p th:if="${keyword != null and !keyword.isBlank()}">没有匹配「<span th:text="${keyword}"></span>」的文章，换个关键字试试。</p>
            <p th:unless="${keyword != null and !keyword.isBlank()}">还没有已发布的文章。</p>
            <a class="btn btn-primary" th:href="@{/admin/articles/new}">去写第一篇</a>
        </div>
    </div>

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
