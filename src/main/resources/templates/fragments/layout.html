<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' · ' + ${blogTitle}">我的个人博客</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="header" class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-dot"></span>
            <span th:text="${blogTitle}">我的个人博客</span>
        </a>
        <nav class="nav">
            <a th:href="@{/}">首页</a>
            <a th:href="@{/admin}">后台管理</a>
        </nav>
    </div>
</header>

<aside th:fragment="sidebar" class="sidebar">
    <div class="card author-card">
        <div class="avatar" th:text="${#strings.substring(blogAuthor, 0, 1)}">博</div>
        <h3 th:text="${blogAuthor}">博主</h3>
        <p th:text="${blogSubtitle}">记录学习与生活的角落</p>
    </div>

    <div class="card">
        <h4 class="card-title">文章分类</h4>
        <ul class="category-list" th:if="${not #lists.isEmpty(categories)}">
            <li th:each="category : ${categories}">
                <span th:text="${category}">后端</span>
            </li>
        </ul>
        <p class="muted" th:if="${#lists.isEmpty(categories)}">暂无分类</p>
    </div>

    <div class="card">
        <h4 class="card-title">关于本站</h4>
        <p class="muted">
            使用 Spring Boot + Thymeleaf + JPA 搭建的个人博客，
            数据默认存放在本地 H2 文件数据库，也可切换到 MySQL。
        </p>
    </div>
</aside>

<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <p>
            © 2024 <span th:text="${blogAuthor}">博主</span>
            · Powered by Spring Boot &amp; Thymeleaf
        </p>
    </div>
</footer>

</body>
</html>
