<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' · ' + ${blogTitle}">我的个人博客</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- 动态样式表：内容由 ThemeCssController 生成，里面带着管理员设置的壁纸路径 -->
    <link rel="stylesheet" th:href="@{/theme.css}">

    <!-- 这段必须放在 CSS 之后、页面渲染之前：先把"上次选的卡片配色"贴到 <html> 上，
         否则会先白一下再变色（闪屏）。只有 JS 可用时才给 html 加 .js，
         这样脚本被禁用时文章列表也不会因为 .reveal 而整片空白。 -->
    <script>
        document.documentElement.classList.add('js');
        try {
            var savedCard = localStorage.getItem('blog.cardTheme');
            if (savedCard) {
                document.documentElement.setAttribute('data-card', savedCard);
            }
        } catch (e) {
            /* 隐私模式下 localStorage 可能不可用，忽略即可 */
        }
    </script>
    <script defer th:src="@{/js/reading.js}"></script>
</head>
<body>

<header th:fragment="header" class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-dot"></span>
            <span th:text="${blogTitle}">我的个人博客</span>
        </a>
        <nav class="nav">
            <a th:href="@{/}">首页</a>
            <a th:href="@{/admin}">后台管理</a>
            <!-- 只有管理员看得到"外观设置"（换背景壁纸的入口） -->
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/settings}">更换壁纸</a>

            <!-- 已登录：显示当前账号 + 退出按钮（退出必须是 POST + CSRF token） -->
            <span sec:authorize="isAuthenticated()" style="display:inline">
                <span class="nav-user" sec:authentication="name">admin</span>
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-sm">退出</button>
                </form>
            </span>
            <!-- 未登录：显示登录入口 -->
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}">登录</a>
        </nav>
    </div>
</header>

<aside th:fragment="sidebar" class="sidebar">
    <div class="card author-card">
        <div class="avatar" th:text="${#strings.substring(blogAuthor, 0, 1)}">博</div>
        <h3 th:text="${blogAuthor}">博主</h3>
        <p th:text="${blogSubtitle}">记录学习与生活的角落</p>
    </div>

    <!-- 外观：切换卡片配色，让文章卡片和壁纸更搭。
         点一下由 /js/reading.js 处理：改 <html data-card> + 存 localStorage。 -->
    <div class="card" id="appearance">
        <h4 class="card-title">外观</h4>
        <p class="theme-tip">选一个和壁纸相配的配色（会记住）</p>
        <div class="theme-swatches" role="group" aria-label="卡片配色">
            <button class="swatch" type="button" data-card-set="snow" aria-pressed="false">
                <span class="chip"></span>
                <span class="name">雪白</span>
            </button>
            <button class="swatch" type="button" data-card-set="sand" aria-pressed="false">
                <span class="chip"></span>
                <span class="name">暖砂</span>
            </button>
            <button class="swatch" type="button" data-card-set="pine" aria-pressed="false">
                <span class="chip"></span>
                <span class="name">雾松</span>
            </button>
        </div>
    </div>

    <div class="card">
        <h4 class="card-title">文章分类</h4>
        <ul class="category-list" th:if="${not #maps.isEmpty(categoryCounts)}">
            <li>
                <a th:href="@{/}">全部</a>
            </li>
            <li th:each="entry : ${categoryCounts}">
                <a th:href="@{/(category=${entry.key})}"
                   th:classappend="${entry.key == currentCategory} ? 'active'"
                   th:text="${entry.key}">后端</a>
                <span class="count" th:text="${entry.value}">0</span>
            </li>
        </ul>
        <p class="muted" th:if="${#maps.isEmpty(categoryCounts)}">暂无分类</p>
    </div>

    <div class="card">
        <h4 class="card-title">关于本站</h4>
        <p class="muted">
            使用 Spring Boot + Thymeleaf + JPA 搭建的个人博客，
            数据默认存放在本地 H2 文件数据库，也可切换到 MySQL。
        </p>
    </div>
</aside>

<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <p>
            © 2024 <span th:text="${blogAuthor}">博主</span>
            · Powered by Spring Boot &amp; Thymeleaf
        </p>
    </div>
</footer>

</body>
</html>
