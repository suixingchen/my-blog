<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('后台管理')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="page-head">
        <div>
            <h1>后台管理</h1>
            <p class="muted">管理全部文章，包括未发布的草稿</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/articles/new}">+ 写新文章</a>
    </div>

    <div class="alert" th:if="${message}" th:text="${message}">操作成功</div>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}">操作失败</div>

    <div class="stats">
        <div class="stat">
            <span class="stat-value" th:text="${totalCount}">0</span>
            <span class="stat-label">文章总数</span>
        </div>
        <div class="stat">
            <span class="stat-value" th:text="${publishedCount}">0</span>
            <span class="stat-label">已发布</span>
        </div>
        <div class="stat">
            <span class="stat-value" th:text="${draftCount}">0</span>
            <span class="stat-label">草稿</span>
        </div>
    </div>

    <form class="search-bar" th:action="@{/admin}" method="get">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="按标题或标签搜索…">
        <button type="submit" class="btn btn-primary">搜索</button>
        <a class="btn" th:href="@{/admin}" th:if="${keyword != null and !keyword.isBlank()}">清空</a>
    </form>

    <div class="card table-card">
        <table class="admin-table">
            <thead>
            <tr>
                <th>标题</th>
                <th>分类</th>
                <th>状态</th>
                <th>阅读</th>
                <th>创建时间</th>
                <th class="col-actions">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="article : ${articles}">
                <td>
                    <a th:href="@{/article/{id}(id=${article.id})}" th:text="${article.title}">标题</a>
                </td>
                <td th:text="${article.category} ?: '—'">分类</td>
                <td>
                    <span class="status status-published" th:if="${article.published}">已发布</span>
                    <span class="status status-draft" th:unless="${article.published}">草稿</span>
                </td>
                <td th:text="${article.views}">0</td>
                <td th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}">时间</td>
                <td class="col-actions">
                    <a class="btn btn-sm" th:href="@{/admin/articles/{id}/edit(id=${article.id})}">编辑</a>
                    <form th:action="@{/admin/articles/{id}/delete(id=${article.id})}" method="post"
                          class="inline-form"
                          onsubmit="return confirm('确定删除这篇文章吗？');">
                        <button type="submit" class="btn btn-sm btn-danger">删除</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(articles)}">
                <td colspan="6" class="muted center">没有匹配的文章。</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="pagination" th:if="${articlePage.totalPages > 1}">
        <a class="page-link" th:classappend="${articlePage.first} ? 'disabled'"
           th:href="@{/admin(page=${articlePage.number}, keyword=${keyword})}">上一页</a>
        <a class="page-link" th:each="i : ${#numbers.sequence(1, articlePage.totalPages)}"
           th:classappend="${i == articlePage.number + 1} ? 'active'"
           th:href="@{/admin(page=${i}, keyword=${keyword})}"
           th:text="${i}">1</a>
        <a class="page-link" th:classappend="${articlePage.last} ? 'disabled'"
           th:href="@{/admin(page=${articlePage.number + 2}, keyword=${keyword})}">下一页</a>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
