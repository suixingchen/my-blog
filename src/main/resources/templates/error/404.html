<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('页面不存在')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container narrow">
    <div class="card error-page">
        <p class="error-code" th:text="${status} ?: 404">404</p>
        <h1 th:text="${errorTitle} ?: '文章走丢了'">文章走丢了</h1>
        <p class="muted" th:text="${errorMessage} ?: '你要找的内容不存在或已经被删除。'">
            你要找的内容不存在或已经被删除。
        </p>
        <div class="form-actions center-actions">
            <a class="btn btn-primary" th:href="@{/}">回到首页</a>
            <a class="btn" th:href="@{/admin}">去后台管理</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
